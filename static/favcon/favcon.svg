<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0A0C12"/>
    </radialGradient>

    <!-- Vibrant Gold/Yellow Gradient -->
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDD00"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>

    <!-- Lens Gradient -->
    <radialGradient id="lensGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2A3245"/>
      <stop offset="70%" stop-color="#11141A"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#FF9900" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark Rounded Square Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#yellowGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Integrated "B" + Camera Emblem -->
  <g filter="url(#glow)">
    <!-- Top Flash / Viewfinder Notch -->
    <path d="M 206 100 L 306 100 C 318 100 326 108 322 120 L 314 140 L 198 140 L 190 120 C 186 108 194 100 206 100 Z" fill="url(#yellowGrad)"/>
    <circle cx="286" cy="120" r="8" fill="#141824"/>

    <!-- Main "B" Camera Silhouette -->
    <!-- Combines the vertical stem and two loops of 'B' into a camera body -->
    <path d="
      M 136 140 
      H 326 
      A 50 50 0 0 1 376 190 
      A 50 50 0 0 1 336 238 
      A 64 64 0 0 1 386 302 
      A 64 64 0 0 1 322 366 
      H 136 
      Z
    " fill="url(#yellowGrad)"/>

    <!-- Inner Cutout: Top Loop (Acts as Lens Mount) -->
    <circle cx="270" cy="215" r="42" fill="#0A0C12"/>
    <circle cx="270" cy="215" r="34" fill="url(#lensGrad)"/>
    <circle cx="270" cy="215" r="22" fill="url(#yellowGrad)"/>
    <circle cx="270" cy="215" r="14" fill="#0A0C12"/>
    <circle cx="265" cy="210" r="4" fill="#FFFFFF" opacity="0.8"/> <!-- Lens Glare -->

    <!-- Inner Cutout: Bottom Loop -->
    <path d="M 196 280 H 300 A 28 28 0 0 1 328 308 A 28 28 0 0 1 300 336 H 196 Z" fill="#0A0C12"/>

    <!-- Left Vertical Accent Stripe (Enhances 'B' Stem) -->
    <rect x="156" y="160" width="16" height="186" rx="8" fill="#0A0C12" opacity="0.25"/>
  </g>
</svg>
