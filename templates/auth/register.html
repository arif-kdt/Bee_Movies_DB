{% extends 'base.html' %}
{% block body %}
<div class="auth-container">

    <h1>BEE MOVIES DB</h1>
    <h3>Create your account to dive into the database.</h3>

    <form method="POST">
        {% csrf_token %}

        <!-- Full Name -->
        <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="Enter your name"
                autocomplete="name" required>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email"
                autocomplete="email" required>
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password" class="form-control"
                    placeholder="Enter your password" autocomplete="new-password" required>
            </div>
        </div>

        <!-- Confirm Password -->
        <div class="mb-3">
            <label for="confirm_password" class="form-label">Confirm Password</label>
            <div class="password-wrapper">
                <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                    placeholder="Re-enter your password" autocomplete="new-password" required>

            </div>
        </div>

        <!-- Register Button -->
        <div class="mb-3">
            <button type="submit" class="btn btn-warning login-btn">Register</button>
        </div>

        <!-- Login Link -->
        <div>
            <p class="register-text">Already have an account?
                <a href="{% url 'accounts:login_view' %}" class="register-link">Login</a>
            </p>
        </div>
    </form>
    {% if messages %}
    <div class="messages">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}
</div>


{% endblock %}
